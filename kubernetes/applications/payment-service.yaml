apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: enterprise-dev
  labels:
    app: payment-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service
          image: payment-service:1.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5002

          env:
            - name: ENVIRONMENT
              value: "dev"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: enterprise-dev

spec:
  selector:
    app: payment-service

  ports:
    - port: 5002
      targetPort: 5002

  type: ClusterIP