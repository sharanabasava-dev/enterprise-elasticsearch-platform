apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: enterprise-dev
  labels:
    app: order-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: order-service:1.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5001

          env:
            - name: ENVIRONMENT
              value: "dev"

            - name: CUSTOMER_SERVICE_URL
              value: "http://customer-service:5000"

            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:5002"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
               path: /health
               port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
               path: /health
               port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: enterprise-dev

spec:
  selector:
    app: order-service

  ports:
    - port: 5001
      targetPort: 5001

  type: ClusterIP
