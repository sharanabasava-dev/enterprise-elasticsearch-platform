apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sharanabasava-dev/enterprise-elasticsearch-platform.git
    targetRevision: main
    path: kubernetes/applications
    directory:
      include: payment-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: enterprise-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
